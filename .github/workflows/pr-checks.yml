name: Android pull request checks

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Test, lint and build
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --console=plain
      - name: Verify public package
        run: |
          if unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -Fq \
            'assets/taishan-dictionary.v1.json'; then
            echo 'Unlicensed book dataset must not be distributed.' >&2
            exit 1
          fi
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: app/build/reports/
          retention-days: 7
          if-no-files-found: ignore
