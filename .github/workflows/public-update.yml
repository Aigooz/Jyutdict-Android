name: Android public update

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-public-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Restore existing update signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo 'Configure ANDROID_DEBUG_KEYSTORE_B64 before publishing updates.' >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/update.keystore"
      - name: Test and build
        run: |
          chmod +x gradlew
          build=$((1000 + ${{ github.run_number }}))
          echo "UPDATE_BUILD=$build" >> "$GITHUB_ENV"
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --console=plain \
            "-PappUpdateBuild=$build" \
            "-PappDebugKeystore=$RUNNER_TEMP/update.keystore"
      - name: Verify certificate and public package
        run: |
          tools="$ANDROID_HOME/build-tools/37.0.0"
          report=$("$tools/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk)
          printf '%s\n' "$report"
          printf '%s\n' "$report" | grep -Fq \
            'certificate SHA-256 digest: d9186624cfa4575aa965b67164fd473737acb6d633a249740532901b4876fdfd'
          if unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -Fq 'assets/taishan-dictionary.v1.json'; then
            echo 'Unlicensed book dataset must not be distributed.' >&2
            exit 1
          fi
          cp app/build/outputs/apk/debug/app-debug.apk Yueci-Android-dual-debug.apk
          sha256sum Yueci-Android-dual-debug.apk > SHA256SUMS
      - name: Publish public release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(sed -n 's/^appVersionName=//p' gradle.properties | tr -d '\r')
          gh release create "build-$UPDATE_BUILD" \
            Yueci-Android-dual-debug.apk SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "粤辞 $version build $UPDATE_BUILD" \
            --notes-file docs/release-notes.md --latest
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/update.keystore"
