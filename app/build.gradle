apply plugin: 'com.android.application'

def semanticVersion = providers.gradleProperty("appVersionName").get()
def appIdSuffix = providers.gradleProperty("appApplicationIdSuffix").getOrElse("")
def appNameProps = new Properties()
def appNameFile = rootProject.file('app-name.properties')
if (appNameFile.exists()) {
    appNameFile.newReader('UTF-8').withCloseable { reader -> appNameProps.load(reader) }
}
def appDisplayName = appNameProps.getProperty("appDisplayName") ?: '\u6cdb\u7cb5\u5178'
def updateBuildNumber = providers.gradleProperty("appUpdateBuild").getOrElse("0").toInteger()
def updateRepository = providers.gradleProperty("appUpdateRepo")
        .getOrElse("Aigooz/Jyutdict-Android")
def customDebugKeystore = providers.gradleProperty("appDebugKeystore").orNull
def semanticVersionMatcher = semanticVersion =~ /^(\d+)\.(\d+)\.(\d+)$/
if (!semanticVersionMatcher.matches()) {
    throw new GradleException("appVersionName must use major.minor.patch: ${semanticVersion}")
}
def versionMajor = semanticVersionMatcher.group(1).toInteger()
def versionMinor = semanticVersionMatcher.group(2).toInteger()
def versionPatch = semanticVersionMatcher.group(3).toInteger()
if (versionMinor > 99 || versionPatch > 99) {
    throw new GradleException("minor and patch must be between 0 and 99")
}
def semanticVersionCode = versionMajor * 10000 + versionMinor * 100 + versionPatch
if (semanticVersionCode <= 670) {
    throw new GradleException("versionCode must remain above previously released code 670")
}

android {
    // This module is Java-only; keep AGP's built-in Kotlin support disabled per module.
    enableKotlin = false
    compileSdk = 37

    if (customDebugKeystore != null) {
        signingConfigs {
            updateDebug {
                storeFile rootProject.file(customDebugKeystore)
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    defaultConfig {
        applicationId "cc.ecisr.jyutdict${appIdSuffix}"
        minSdk = 23
        targetSdk = 37
        versionCode semanticVersionCode
        versionName semanticVersion
        resourceConfigurations += ['zh', 'zh-rCN', 'zh-rTW']
        resValue "string", "app_name", appDisplayName
        buildConfigField "String", "UPDATE_REPO", "\"${updateRepository}\""
        buildConfigField "int", "UPDATE_BUILD", String.valueOf(updateBuildNumber)

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            if (customDebugKeystore != null) {
                signingConfig signingConfigs.updateDebug
            }
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = 17
        targetCompatibility = 17
    }
    namespace = 'cc.ecisr.jyutdict'
    androidResources {
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*~:taishan-dictionary.v1.json'
    }
    buildFeatures {
        buildConfig = true
        resValues = true
        viewBinding = true
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }

}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.11.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'org.commonmark:commonmark:0.30.0'
    implementation 'org.commonmark:commonmark-ext-gfm-tables:0.30.0'
    implementation 'com.github.houbb:opencc4j:1.13.1'
    implementation 'org.jsoup:jsoup:1.21.2'

    // ViewPager2
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.work:work-runtime:2.10.0'
}
